# OPF supervised (Model 1) training config.
#
# Model 1: supervised surrogate trained with MSE loss against OPF labels
# (Pg_opt, V_opt_mag, V_opt_ang). Same GNSMsg_EdgeSelfAttn_OPF architecture
# as Model 2 but trained from ground-truth economic-dispatch solutions instead
# of the physics-informed loss.
#
# Loss = MSE(V_pred, V_opt) + 0.1 * MSE(Pg_pred[pv], Pg_opt[pv])
#
# Requires an OPF-labeled dataset (generated with generate_synthetic.py or
# generate_ring.py which include cost_opt / Pg_opt / V_opt columns).

run:
  name: null
  mode: train_test
  seed: 42

split:
  mode: ratio
  train_ratio: 0.80
  valid_ratio: 0.10

data:
  parquet_paths:
    - ./datasets/synthetic_opf_n5_ring.parquet
  per_unit: false

flags:
  pinn: true          # required to build OPF model (pinn=true enables cost/KCL heads)
  block_diag: true
  normalize: false
  mag_ang_mse: false
  float64: false

model:
  name: GNSMsg_EdgeSelfAttn_OPF_Supervised   # triggers supervised training loop

  d: 4
  d_hi: 16
  num_attn_layers: 1
  K: 15
  gamma: 0.95
  vlimit: true
  use_armijo: true
  DthetaMax: 0.30
  DvmFrac: 0.10

  # Physics loss weights (not used in supervised loop but needed by builder)
  lambda_cost:   1.0
  lambda_kcl:    5.0
  lambda_lim:   20.0
  lambda_branch:  2.0
  lambda_v:       2.0

  pg_step_frac: 0.05
  c1_default:   2.0
  c2_default:   0.5
  pg_lim_frac:  0.30
  s_max_pu:     1.0

train:
  batch_size: 32
  epochs: 100
  lr: 3.0e-4
  val_every: 5

optimizer:
  weight_init: sd0.02
  bias_init: 0.0
  weight_decay: 1.0e-3
  lr_scheduler: CosineAnnealingLR
  cosine_restart_epoch: 50

misc:
  adj_mode: cplx

peft:
  enabled: false

mlflow:
  enabled: false
  tracking_uri: sqlite:///results/mlflow.db
  artifact_location: file:./results/mlruns
  experiment: opf_supervised
  artifact_path: run
  keep_local_run_dir: true
  strict: false
